services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      POSTGRES_DB: ${POSTGRES_DB:-ask_your_db}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./data/demo_db/init.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./data/demo_db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./data/demo_db/roles.sql:/docker-entrypoint-initdb.d/03_roles.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ${POSTGRES_DB:-ask_your_db}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://app:app_password@db:5432/ask_your_db}
      LLM_BACKEND: ${LLM_BACKEND:-mock}
    ports:
      - "${APP_PORT:-8000}:8000"

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    env_file: .env
    environment:
      API_BASE_URL: http://app:8000
    ports:
      - "${STREAMLIT_SERVER_PORT:-8501}:8501"
    command: ["streamlit", "run", "src/ui/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]

volumes:
  db_data:
