name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: ask_your_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src tests

      - name: Initialize database schema
        env:
          PGPASSWORD: app_password
        run: |
          psql -h localhost -U app -d ask_your_db -f data/demo_db/init.sql
          psql -h localhost -U app -d ask_your_db -f data/demo_db/seed.sql
          psql -h localhost -U app -d ask_your_db -f data/demo_db/roles.sql

      - name: Run tests
        env:
          DATABASE_URL: postgresql://app:app_password@localhost:5432/ask_your_db
          LLM_BACKEND: mock
          APP_READONLY_USER: app_readonly
          APP_READONLY_PASSWORD: app_readonly_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: ask_your_db
        run: pytest tests -q --tb=short

      - name: Build Docker image
        run: docker build -t ask-your-database:ci .
